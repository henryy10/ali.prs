*{box-sizing:border-box} :root{--paper:#f3f0e8;--ink:#243d37;--muted:#69776f;--accent:#a9c3a0} body{margin:0;background:var(--paper);color:var(--ink);font-family:Arial,Helvetica,sans-serif;height:100svh;overflow:hidden}button{font:inherit;color:inherit;cursor:pointer}header{position:fixed;top:0;left:0;right:0;display:flex;align-items:center;justify-content:space-between;padding:24px 4.5%;z-index:5} .brand{font-size:12px;letter-spacing:2px;text-transform:uppercase;display:flex;align-items:center;gap:12px}.logo{width:25px;height:25px;border:1px solid var(--ink);border-radius:50%;box-shadow:7px 0 0 -3px var(--paper),8px 0 0 -3px var(--ink)}.pill{background:transparent;border:1px solid #243d3730;border-radius:30px;padding:10px 17px;font-size:13px;transition:background .2s}.pill:hover{background:#243d3710}main{height:100%;position:relative} .slide{position:absolute;inset:83px 4.5% 92px;display:grid;grid-template-columns:1.4fr .6fr;gap:6%;align-items:center;opacity:0;visibility:hidden;transform:translateY(24px);transition:opacity .55s,transform .65s cubic-bezier(.2,.7,.2,1),visibility .65s;pointer-events:none}.slide.active{opacity:1;visibility:visible;transform:translateY(0);pointer-events:auto}.copy{max-height:100%;overflow:auto;padding:20px 3px;scrollbar-width:thin}.kicker{font-size:12px;text-transform:uppercase;letter-spacing:2.3px;color:var(--muted);margin-bottom:23px;display:flex;gap:12px;align-items:center}.kicker:before{content:'';height:1px;width:30px;background:var(--muted)}h1,h2{font-weight:400;letter-spacing:-2px;line-height:1.05;margin:0 0 30px;font-size:clamp(32px,3.8vw,62px)}p{font-size:clamp(19px,1.68vw,27px);line-height:1.52;margin:0 0 20px}p:last-child{margin:0}.line{opacity:0;transform:translateY(18px);transition:opacity .65s,transform .65s}.active .line{opacity:1;transform:none;transition-delay:calc(var(--i)*.105s + .1s)} .art{aspect-ratio:1;position:relative;display:flex;align-items:center;justify-content:center}.orb{width:90%;height:90%;border-radius:  solid #302b4412;border-radius:20px;padding:21px;font-size:21px;position:relative}.steps i{font-style:normal;font-size:13px;display:inline-grid;place-items:center;border-radius:50%;background:#b4a6db;width:34px;height:34px;margin-right:15px}.steps em{display:block;font-style:normal;font-size:14px;color:var(--muted);margin:9px 0 0 50px}.speech{padding:26px;border-radius:24px 24px 24px 3px;background:#e4dcf6;font-size:23px;width:90%;line-height:1.3}.speech span{display:block;font-size:14px;margin-top:12px;color:var(--muted)}.speech.offset{align-self:flex-end;background:#fff;border:1px solid #302b4415;border-radius:24px 24px 3px 24px}.result{background:var(--ink);color:white;padding:20px 16px;border-radius:18px;text-align:center;font-size:16px;line-height:1.4}.compare{display:grid;gap:17px}.compare>div{background:#e8e2f3;padding:28px;border:1px solid #302b4418;border-radius:23px}.compare>div:last-child{background:#dce9df}.compare small{display:block;letter-spacing:1px;font-size:11px;color:var(--muted)}.compare b{display:block;font-size:30px;font-weight:400;margin:16px 0 10px}.compare span{font-size:16px;line-height:1.5}.limits{border-top:1px solid #b6acc6}.limits>span{display:block;padding:26px 10px;border-bottom:1px solid #b6acc6;color:#8d79b0;font-size:14px}.limits b{color:var(--ink);font-weight:400;font-size:23px;margin-left:18px}.word-card{background:#fff;border:1px solid #302b4420;border-radius:25px;padding:25px;text-align:center;transform:rotate(3deg);box-shadow:0 20px 40px #302b4410}.word-card>span{font-size:11px;letter-spacing:2px;color:var(--muted)}.tree{font-size:100px;line-height:1.5;color:#748d73}.word-card b{display:block;font-size:43px;letter-spacing:1px;font-weight:400}.word-card small{display:block;margin-top:15px;color:var(--muted);font-size:14px}.active .art{animation:arrive .85s cubic-bezier(.2,.7,.2,1) both}.active .steps>div{animation:arrive .8s both}.active .steps>div:nth-child(2){animation-delay:.15s}.active .steps>div:nth-child(3){animation-delay:.3s}.active .steps>div:nth-child(4){animation-delay:.45s}@keyframes arrive{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:translateY(0)}}.round:hover,.pill:hover{background:#e1d8f2}.dot.current{background:#7963ad}.progress{background:#7963ad}

</style></head><body><header><div class="brand"><span class="logo"></span>Micro-teaching</div><button class="pill" id="fullscreen" aria-label="Полноэкранный режим">⛶ &nbsp; Полный экран</button></header><main id="deck"></main><footer><div class="dots" aria-label="Выбор слайда"></div><span class="hint">← → &nbsp; / &nbsp; свайп для переключения</span><div class="nav"><button class="round" id="prev" aria-label="Предыдущий слайд">←</button><span class="count" aria-live="polite"></span><button class="round" id="next" aria-label="Следующий слайд">→</button></div></footer><div class="progress"></div><script>
const slides=[{"person": "Человек 1", "title": "Микротичинг: учимся преподавать", "num": "01", "tag": "ОТ ТРЕНИРОВКИ К УРОКУ", "visual": "photo", "text": ["Микротичинг (micro-teaching) — это метод подготовки будущих учителей. Студент проводит короткий мини-урок на 5–15 минут для небольшой группы из 5–10 человек. Обычно роль учеников выполняют одногруппники.", "После мини-урока студент получает обратную связь и понимает, что ему нужно улучшить. Так он постепенно развивает свои навыки преподавания."]}, {"person": "Человек 1", "title": "Один мини-урок — один навык", "num": "1", "tag": "МЕНЬШЕ МАСШТАБ — БОЛЬШЕ ФОКУС", "visual": "focus", "text": ["На настоящем уроке новичку нужно одновременно объяснять материал, задавать вопросы, управлять классом и следить за временем. Это сложно, когда опыта ещё мало.", "Микротичинг упрощает задачу: времени меньше, группа небольшая, а внимание направлено на один навык. Например, студент учится давать понятные инструкции, объяснять новое слово или проводить warm-up. Ошибки становятся заметнее, и их легче исправить."]}, {"person": "Человек 2", "title": "Как проходит микротичинг", "num": "02", "tag": "ПЛАН → ПРАКТИКА → АНАЛИЗ", "visual": "cycle", "text": ["Микротичинг проходит по циклу. Сначала студент выбирает навык и планирует мини-урок. Затем проводит его для одногруппников, которые играют роль учеников.", "Мини-урок можно записать на видео. Запись помогает увидеть себя со стороны: насколько понятно звучит объяснение, как распределяется время и вовлечены ли ученики в работу."]}, {"person": "Человек 2", "title": "Обратная связь и вторая попытка", "num": "↻", "tag": "ЗАМЕТИТЬ → ИСПРАВИТЬ → ПОВТОРИТЬ", "visual": "feedback", "text": ["После мини-урока преподаватель и одногруппники обсуждают, что получилось хорошо и что стоит улучшить. Сам студент тоже оценивает свою работу, при необходимости просматривая видеозапись.", "Затем он исправляет план и проводит мини-урок ещё раз. Главное в этом методе — применить полученные советы на практике. Вторая попытка позволяет проверить, стало ли преподавание понятнее и эффективнее."]}, {"person": "Человек 3", "title": "Мектеп практикасынан айырмашылығы", "num": "03", "tag": "БІР ДАҒДЫҒА НАЗАР АУДАРУ", "lang": "kk", "visual": "compare", "text": ["Мектептегі педагогикалық практикада студент нақты сыныппен жұмыс істейді. Ол сабақ түсіндіріп, оқушыларды басқарып, сұрақтарға жауап беріп, уақытты да қадағалауы керек.", "Ал микротичингте жағдай жеңілдетіледі: шағын топпен қысқа сабақ өткізіліп, бір нақты дағды жаттықтырылады. Студент бірден кері байланыс алып, сол дағдыны қайта жетілдіре алады."]}, {"person": "Человек 3", "title": "Микротичингтің артықшылықтары", "num": "+", "tag": "ДАҒДЫ · СЕНІМ · РЕФЛЕКСИЯ", "lang": "kk", "visual": "benefits", "text": ["Біріншіден, болашақ мұғалім оқыту дағдыларын тәжірибе арқылы дамытады. Мысалы, тапсырманы түсінікті беруге және оқушыларға дұрыс сұрақ қоюға үйренеді.", "Екіншіден, аудитория алдында сөйлеуге деген сенімділігі артады. Үшіншіден, өз жұмысын талдап, қателерін анықтауды және оларды түзетуді үйренеді."]}, {"person": "Человек 3", "title": "Әдістің шектеулері", "num": "±", "tag": "НАҚТЫ СЫНЫПҚА ДАЙЫНДЫҚ", "lang": "kk", "visual": "limits", "text": ["Микротичингтің кейбір кемшіліктері де бар. Топтастары нақты мектеп оқушылары сияқты әрекет етпеуі мүмкін. Сондықтан мұндай сабақта мектептегі барлық жағдайды көрсету қиын.", "Сонымен қатар, қысқа сабақтың өзіне дайындалуға уақыт қажет. Бір шағын сабақ мұғалімнің барлық қабілетін толық көрсете алмайды. Сол себепті микротичинг мектеп практикасына қосымша дайындық ретінде пайдалы."]}, {"person": "Человек 3", "title": "Мысал: жаңа сөзді түсіндіру", "num": "7", "tag": "КЕРІ БАЙЛАНЫСТЫ ҚОЛДАНУ", "lang": "kk", "visual": "example", "text": ["Студент жаңа ағылшын сөзін түсіндіру дағдысын таңдап, жеті минуттық сабақ дайындайды. Ол сурет көрсетіп, сөздің мағынасын түсіндіреді және сұрақтар арқылы оқушылардың түсінгенін тексереді.", "Сабақтан кейін топтастары оның тым жылдам сөйлегенін және барлық оқушының түсінгенін тексермегенін айтады. Студент келесі жолы баяуырақ сөйлеп, әр оқушыға жауап беруге мүмкіндік береді. Осылайша кері байланыс нақты өзгеріске айналады."]}, {"person": "Человек 3", "title": "Шағын сабақ — үлкен тәжірибе", "num": "↗", "tag": "ЖОСПАРЛАУ → ӨТКІЗУ → ЖЕТІЛДІРУ", "lang": "kk", "visual": "final", "text": ["Микротичинг болашақ мұғалімге бір дағдыны қауіпсіз оқу ортасында жаттықтырып, өз жұмысын талдауға мүмкіндік береді.", "Оның негізгі мәні — қысқа сабақ өткізу ғана емес, кері байланыс арқылы оқыту сапасын жақсарту. Осы тәжірибе студенттің сенімділігін арттырып, нақты мектеп сабағына дайындалуына көмектеседі."]}];

const deck=document.querySelector('#deck');slides.forEach((s,i)=>{const el=document.createElement('section');el.className='slide'+(s.text.join('').length>550?' dense':'');el.lang=s.lang||'ru';el.setAttribute('aria-label',`Слайд ${i+1}`);el.innerHTML=`<div class="copy"><div class="kicker line" style="--i:0">${s.person}</div>${s.title?`<h${i===0?'1':'2'} class="line" style="--i:1">${s.title}</h${i===0?'1':'2'}>`:''}${s.text.map((p,j)=>`<p class="line" style="--i:${j+2}">${p}</p>`).join('')}</div><div class="art visual-${s.visual}" aria-hidden="true">${visuals[s.visual]}</div>`;deck.append(el);const b=document.createElement('button');b.className='dot';b.setAttribute('aria-label',`Слайд ${i+1}`);b.onclick=()=>go(i);document.querySelector('.dots').append(b)});
let current=0;const sections=[...deck.children],dots=[...document.querySelector('.dots').children];function go(n){current=Math.max(0,Math.min(slides.length-1,n));sections.forEach((s,i)=>{s.classList.toggle('active',i===current);s.setAttribute('aria-hidden',i!==current);s.inert=i!==current});dots.forEach((d,i)=>{d.classList.toggle('current',i===current);d.setAttribute('aria-current',i===current?'step':'false')});document.querySelector('.count').textContent=`${String(current+1).padStart(2,'0')} / ${String(slides.length).padStart(2,'0')}`;document.querySelector('.progress').style.width=`${(current+1)/slides.length*100}%`;document.querySelector('#prev').disabled=current===0;document.querySelector('#next').disabled=current===slides.length-1;history.replaceState(null,'',`#${current+1}`)}
document.querySelector('#prev').onclick=()=>go(current-1);document.querySelector('#next').onclick=()=>go(current+1);function toast(t){document.querySelector('.toast')?.remove();const a=document.createElement('div');a.className='toast';a.setAttribute('role','status');a.textContent=t;document.body.append(a);setTimeout(()=>a.remove(),5500)}async function fullscreen(){try{if(document.fullscreenElement)await document.exitFullscreen();else if(document.documentElement.requestFullscreen)await document.documentElement.requestFullscreen();else toast('Браузер не поддерживает полный экран. Откройте презентацию в Safari или Chrome; на iPhone можно добавить её на экран «Домой».')}catch{toast('Полный экран недоступен в этом окне. Откройте ссылку в отдельной вкладке.')}}document.querySelector('#fullscreen').onclick=fullscreen;document.addEventListener('fullscreenchange',()=>{document.querySelector('#fullscreen').textContent=document.fullscreenElement?'⛶  Выйти из полного экрана':'⛶  Полный экран'});document.addEventListener('keydown',e=>{if(['ArrowRight','PageDown',' '].includes(e.key)){e.preventDefault();go(current+1)}if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();go(current-1)}if(e.key==='Home')go(0);if(e.key==='End')go(slides.length-1);if(e.key.toLowerCase()==='f'&&!e.ctrlKey&&!e.metaKey)fullscreen()});let startX=0,startY=0;deck.addEventListener('touchstart',e=>{startX=e.changedTouches[0].clientX;startY=e.changedTouches[0].clientY},{passive:true});deck.addEventListener('touchend',e=>{let dx=e.changedTouches[0].clientX-startX,dy=e.changedTouches[0].clientY-startY;if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)*1.3)go(current+(dx<0?1:-1))},{passive:true});go((parseInt(location.hash.slice(1))||1)-1);
